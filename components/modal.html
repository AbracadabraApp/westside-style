<!-- Contact Modal -->
<div id="contactModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 hidden">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/85" onclick="closeContactModal()"></div>

    <!-- Modal panel -->
    <div class="relative bg-neutral-cloud border border-neutral-stone/20 w-full max-w-sm p-6">
        <!-- Close -->
        <button onclick="closeContactModal()" class="absolute top-4 right-4 font-mono text-base tracking-wide text-neutral-ash hover:text-neutral-ink transition-colors">
            <span class="sr-only">Close contact form</span>
            <span aria-hidden="true">✕ CLOSE</span>
        </button>

        <!-- Heading -->
        <div class="mb-8">
            <h3 class="font-display text-5xl text-neutral-ink">LET'S TALK</h3>
        </div>

        <!-- Form -->
        <form id="contactForm" onsubmit="submitContact(event)" class="space-y-5">
            <div>
                <label for="cf-name" class="block font-mono text-sm tracking-wide text-neutral-ash mb-1">NAME</label>
                <input type="text" id="cf-name" name="name" class="w-full bg-transparent border-b border-neutral-stone/40 focus:border-[#D4AF37] outline-none py-2 font-serif text-xl text-neutral-ink placeholder-neutral-stone/40 transition-colors" placeholder="Your name">
            </div>

            <div>
                <label for="cf-phone" class="block font-mono text-sm tracking-wide text-neutral-ash mb-1">PHONE</label>
                <input type="tel" id="cf-phone" name="phone" pattern="[0-9]{3}[.\-\s]?[0-9]{3}[.\-\s]?[0-9]{4}" class="w-full bg-transparent border-b border-neutral-stone/40 focus:border-[#D4AF37] outline-none py-2 font-serif text-xl text-neutral-ink placeholder-neutral-stone/40 transition-colors" placeholder="206.000.0000">
            </div>

            <div>
                <label for="cf-email" class="block font-mono text-sm tracking-wide text-neutral-ash mb-1">EMAIL</label>
                <input type="email" id="cf-email" name="email" required class="w-full bg-transparent border-b border-neutral-stone/40 focus:border-[#D4AF37] outline-none py-2 font-serif text-xl text-neutral-ink placeholder-neutral-stone/40 transition-colors" placeholder="you@example.com">
            </div>

            <div>
                <label for="cf-notes" class="block font-mono text-sm tracking-wide text-neutral-ash mb-1">NOTES</label>
                <textarea id="cf-notes" name="notes" rows="3" class="w-full bg-transparent border-b border-neutral-stone/40 focus:border-[#D4AF37] outline-none py-2 font-serif text-xl text-neutral-ink placeholder-neutral-stone/40 transition-colors resize-none" placeholder="What are you looking for?"></textarea>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full font-mono text-base tracking-extreme text-neutral-ink bg-[#D4AF37] py-4 hover:bg-warm-amber transition-colors">
                    FREE CONSULTATION
                </button>
            </div>
        </form>
    </div>
</div>
